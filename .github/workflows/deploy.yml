name: Deploy to VPS

# Se ejecuta en cada push a main, y también se puede lanzar a mano
# desde la pestaña "Actions" del repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Evita despliegues solapados si llegan varios pushes seguidos.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Si la llave NO tiene passphrase, deja el secret vacío o no lo crees.
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          # Puerto SSH: usa el secret si existe, si no asume 22.
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            REPO_URL="https://github.com/jerdiaz/malecon-residences.git"
            # Puerto al que apunta nginx (maleconcenter.duckdns.org → localhost:3050).
            export PORT=3050

            # Si el directorio no existe (p. ej. lo borraron al reorganizar el VPS),
            # clonamos el repo en lugar de abortar en el cd.
            if [ ! -d "$APP_PATH/.git" ]; then
              echo "→ El directorio no existe; clonando el repo..."
              git clone "$REPO_URL" "$APP_PATH"
            fi

            cd "$APP_PATH"

            echo "→ Trayendo últimos cambios de main..."
            git fetch --all
            git reset --hard origin/main

            # ── Caché del optimizador de imágenes ──────────────────────
            # `next build` NO limpia .next/cache/images: es una caché pensada
            # para sobrevivir compilaciones. Y next.config.mjs la fija en un
            # año (minimumCacheTTL), con la clave formada por ruta + ancho +
            # calidad — el CONTENIDO del archivo no entra en la clave.
            #
            # Resultado: cuando se reemplazó un render conservando su nombre,
            # el VPS siguió sirviendo el corte viejo. El 2026-09-10 producción
            # mostraba en "El Proyecto" un render que ya no existía en el repo,
            # y 7 de cada 10 renders exteriores estaban igual. En localhost se
            # veían bien, porque su caché se había generado después.
            #
            # Se limpia en cada despliegue. El costo es que el primer visitante
            # de cada imagen paga la optimización una vez; barato al lado de
            # servir arte que ya se retiró.
            echo "→ Limpiando la caché del optimizador de imágenes..."
            rm -rf .next/cache/images

            echo "→ Instalando dependencias..."
            npm ci

            echo "→ Compilando (next build)..."
            npm run build

            echo "→ Reiniciando la app con PM2 (PORT=$PORT)..."
            # Si el proceso no existe, lo creamos con el puerto correcto.
            pm2 reload malecon --update-env || pm2 start npm --name malecon --update-env -- start
            pm2 save

            echo "✓ Despliegue completado."
