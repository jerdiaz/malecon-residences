<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    /* Por defecto lleva placa: es el estado seguro si el navegador ignora la
       media query. En modo claro la placa desaparece y queda el isotipo solo. */
    #placa { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      #placa { fill: none; }
    }
  </style>
  <rect id="placa" width="256" height="256" rx="26"/>
  <image width="256" height="256" href="data:image/png;base64,"/>
</svg>
