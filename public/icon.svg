<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Placa blanca fija, sin depender de prefers-color-scheme: el soporte de
       esa media query dentro de un favicon SVG es inconsistente entre
       navegadores, y cuando no se aplicaba dejaba el logo (navy) sin placa
       sobre una barra de pestañas oscura — casi invisible. Con la placa
       siempre puesta, el logo se lee igual en pestaña clara u oscura. -->
  <rect id="placa" fill="#ffffff" width="256" height="256" rx="26"/>
  <image width="256" height="256" href="data:image/png;base64,"/>
</svg>
